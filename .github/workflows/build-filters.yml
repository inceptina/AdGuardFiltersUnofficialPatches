name: build filters

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
    paths:
      - 'filters/**'
      - scripts/build-filters.py
      - .github/workflows/build-filters.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-filters
  queue: max

jobs:
  build:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: build and publish filter files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch --no-tags origin refs/heads/main
            git switch --detach FETCH_HEAD
            python3 scripts/build-filters.py --update-source-metadata
            git add -- filters
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'Update generated filters and source metadata'
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
          done
          exit 1
