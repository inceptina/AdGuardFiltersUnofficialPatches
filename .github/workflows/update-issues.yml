name: update issue queue

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
    paths:
      - issues/issue-status.json
      - 'filters/**'
      - scripts/build-filters.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-issue-queue
  queue: max

jobs:
  update:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: update issue files
        env:
          event_name: ${{ github.event_name }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          sync_args=()
          if [[ "$event_name" != push ]]; then
            sync_args=(--sync)
          fi

          for attempt in 1 2 3; do
            git fetch --no-tags origin refs/heads/main
            git switch --detach FETCH_HEAD
            python3 scripts/update-issues.py "${sync_args[@]}"
            python3 scripts/build-filters.py
            git add -- issues/issues.json issues/issue-status.json issues/issue-history.json issues/schedule.md filters/annoyances.txt filters/dns.txt
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'Update issue queue and filter bundles'
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
          done
          exit 1
